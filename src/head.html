<style>
/* ===========================================================================
   LOS LOS TRADE GROWTH SYSTEM · 75 LAB
   DNA visual: Sorvetes Los Los (coral #EC7F84, ink #161922, Poppins, formas
   cheias e arredondadas do logotipo) somado ao sistema 75 LAB (Big Shoulders
   Display, Space Mono, cantos retos, grão, lime de dado).
   Palco fixo 1600x900 escalado. Sem dependências externas alem das fontes.
   =========================================================================== */
:root{
  --ink:#12141C; --ink2:#191C26; --ink3:#242938;
  --paper:#F4F1EA; --paper2:#E9E4D8; --paper3:#DCD5C4;
  --coral:#EC7F84; --coral2:#D9646B; --coralink:#A8383F;
  --lime:#C0EE4E; --lime2:#A5D533;
  --teal:#01A290;
  --line:rgba(18,20,28,.16); --soft:rgba(18,20,28,.58); --fill:rgba(18,20,28,.05);
  --acc:var(--coral2); --accs:var(--coralink);
  --pad:58px; --ease:cubic-bezier(.16,.84,.28,1);
  --fdisp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --ftext:'Poppins',ui-sans-serif,system-ui,sans-serif;
  --fmono:'Space Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--ftext);color:var(--ink);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;cursor:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:none;text-align:left}
img{display:block;max-width:100%}
::selection{background:var(--coral);color:var(--ink)}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

/* ---------- cursor em dois tons (visivel sobre coral, lime, ink e paper) ---------- */
#cur,#dot{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;will-change:transform}
#cur{width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--ink);
  box-shadow:0 0 0 2px rgba(244,241,234,.92),inset 0 0 0 2px rgba(244,241,234,.92);
  transition:width .26s var(--ease),height .26s var(--ease),margin .26s var(--ease),border-color .24s}
#dot{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--coral);
  box-shadow:0 0 0 2.5px rgba(244,241,234,.95),0 0 0 4.4px rgba(18,20,28,.6)}
body.hot #cur{width:64px;height:64px;margin:-32px 0 0 -32px;border-color:var(--ink);
  box-shadow:0 0 0 2px rgba(244,241,234,.95),inset 0 0 0 2px rgba(244,241,234,.95),
  inset 0 0 0 14px rgba(236,127,132,.22)}
body.zoom #cur::after{content:'VER';position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--fmono);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--ink)}
@media (hover:none){body{cursor:auto}#cur,#dot{display:none}}

/* ---------- palco ---------- */
#deck{position:fixed;inset:0;overflow:clip;background:var(--ink)}
#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:center center;
  overflow:clip;background:var(--paper)}
.slide{position:absolute;inset:0;display:none;flex-direction:column;overflow:clip;
  padding:calc(var(--pad) + 52px) var(--pad) calc(var(--pad) + 44px);background:var(--paper);color:var(--ink)}
.slide.dark{background:var(--ink);color:var(--paper);
  --line:rgba(244,241,234,.2); --soft:rgba(244,241,234,.6); --fill:rgba(244,241,234,.06);
  --acc:var(--coral); --accs:var(--coral)}
.slide.on{display:flex;animation:sin .56s var(--ease) both}
.slide.out{display:flex;animation:sout .36s var(--ease) both}
@keyframes sin{from{opacity:0;transform:translate3d(38px,0,0) scale(.992)}to{opacity:1;transform:none}}
@keyframes sout{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(-28px,0,0) scale(.994)}}
.slide.on [data-a]{animation:up .62s var(--ease) both;animation-delay:calc(var(--d,0)*70ms + 120ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.slide.on [data-fade]{animation:fin .8s var(--ease) both;animation-delay:calc(var(--d,0)*70ms + 160ms)}
@keyframes fin{from{opacity:0}to{opacity:1}}
.slide.on [data-scale]{animation:sc .8s var(--ease) both;animation-delay:calc(var(--d,0)*70ms + 140ms)}
@keyframes sc{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* traco SVG que se desenha */
.slide.on .draw{stroke-dasharray:var(--len,1200);stroke-dashoffset:var(--len,1200);
  animation:drw 1.5s var(--ease) both;animation-delay:calc(var(--d,0)*90ms + 300ms)}
@keyframes drw{to{stroke-dashoffset:0}}
.slide.on .grow{transform-origin:left center;animation:grw 1.1s var(--ease) both;
  animation-delay:calc(var(--d,0)*80ms + 320ms)}
@keyframes grw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.slide.on .growy{transform-origin:bottom center;animation:grwy 1s var(--ease) both;
  animation-delay:calc(var(--d,0)*80ms + 300ms)}
@keyframes grwy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.slide.on .pop{animation:pp .7s var(--ease) both;animation-delay:calc(var(--d,0)*60ms + 300ms)}
@keyframes pp{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}

/* ---------- fundo vivo, discreto ---------- */
.bgw{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:clip}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.3;will-change:transform}
.b1{width:620px;height:620px;background:var(--coral);left:-180px;top:-200px;animation:fl1 26s ease-in-out infinite}
.b2{width:520px;height:520px;background:var(--teal);right:-160px;bottom:-190px;animation:fl2 31s ease-in-out infinite}
.b3{width:380px;height:380px;background:var(--lime);right:22%;top:-160px;opacity:.16;animation:fl3 24s ease-in-out infinite}
@keyframes fl1{50%{transform:translate(120px,80px) scale(1.14)}}
@keyframes fl2{50%{transform:translate(-110px,-70px) scale(1.1)}}
@keyframes fl3{50%{transform:translate(-90px,110px) scale(1.2)}}
.slide:not(.dark) .blob{opacity:.16}
.slide:not(.dark) .b3{opacity:.12}
.glw{position:absolute;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;z-index:1;
  pointer-events:none;background:radial-gradient(circle,rgba(236,127,132,.16),transparent 62%);
  will-change:transform;transition:opacity .5s}
.slide:not(.dark) .glw{background:radial-gradient(circle,rgba(1,162,144,.1),transparent 62%)}
.dotsw{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);background-size:34px 34px}
#grain{position:absolute;inset:0;width:100%;height:100%;z-index:60;pointer-events:none;
  opacity:.07;mix-blend-mode:multiply}
#grain.inv{mix-blend-mode:screen;opacity:.1}
#vig{position:absolute;inset:0;z-index:59;pointer-events:none;
  box-shadow:inset 0 0 200px rgba(18,20,28,.16)}
.slide>*:not(.bgw):not(.dotsw):not(.glw){position:relative;z-index:2}

/* ---------- tipografia ---------- */
.eyebrow{font-family:var(--fmono);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--soft);display:flex;align-items:center;gap:10px}
.eyebrow i{font-style:normal;color:var(--acc)}
.eyebrow s{width:26px;height:2px;background:var(--acc);text-decoration:none;display:block}
h1,h2,h3,.disp{font-family:var(--fdisp);font-weight:900;text-transform:uppercase;
  letter-spacing:-.025em;line-height:1.05}
h1{font-size:96px}
h2{font-size:68px}
h2.sm{font-size:54px}
h3{font-size:34px;letter-spacing:-.015em}
h1 em,h2 em,h3 em,.disp em{font-style:normal;color:var(--acc)}
h1 u,h2 u,h3 u{text-decoration:none;color:rgba(18,20,28,.3)}
.slide.dark h1 u,.slide.dark h2 u,.slide.dark h3 u{color:rgba(244,241,234,.3)}
.lead{font-size:16.5px;line-height:1.56;color:var(--soft);max-width:58ch;font-weight:400}
.lead b{color:inherit;font-weight:600}
.slide.dark .lead b{color:var(--paper)}
.lead.big{font-size:20px;line-height:1.5}
.note{font-family:var(--fmono);font-size:10.5px;line-height:1.55;color:var(--soft);letter-spacing:.01em;max-width:120ch}
.slide>.note:last-child{margin-top:auto;padding-top:20px}
.note b{color:var(--acc);font-weight:700}
.src{font-family:var(--fmono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--soft);opacity:.85}
.hd{display:flex;flex-direction:column;gap:15px}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:28px}
.row{display:flex;gap:24px}
.num{font-family:var(--fdisp);font-weight:900;line-height:.84;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mono{font-family:var(--fmono);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.tnum{font-variant-numeric:tabular-nums}
.voice{font-family:var(--ftext);font-weight:700;text-transform:none;letter-spacing:-.02em;line-height:1.1}

/* ---------- chrome ---------- */
#top,#bot{position:absolute;left:0;right:0;height:52px;display:flex;align-items:center;gap:16px;
  padding:0 var(--pad);z-index:70}
#top{top:0}#bot{bottom:0}
.sp{flex:1}
.brand{display:flex;align-items:center;gap:14px}
.brand img.ll{height:32px;width:auto}
.brand img.l75{height:15px;width:auto}
.x{font-family:var(--fmono);font-size:12px;color:var(--soft)}
.chip{font-family:var(--fmono);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  border:2px solid var(--line);padding:7px 14px;color:inherit;transition:.2s var(--ease)}
.chip:hover{background:var(--coral);border-color:var(--coral);color:var(--ink);transform:translate(-2px,-2px)}
#prog{position:absolute;top:0;left:0;height:3px;background:var(--coral);z-index:90;transition:width .5s var(--ease)}
.nb{width:34px;height:34px;border:2px solid var(--line);display:grid;place-items:center;transition:.2s var(--ease)}
.nb:hover{background:var(--coral);border-color:var(--coral);color:var(--ink);transform:translate(-2px,-2px)}
.nb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#count{font-family:var(--fmono);font-weight:700;font-size:12px;letter-spacing:.14em;min-width:58px;
  text-align:center;color:var(--soft)}
#count b{color:inherit}
.part{font-family:var(--fmono);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.part i{font-style:normal;color:var(--acc)}
#top.inv,#bot.inv{color:var(--paper)}
#top.inv .chip,#bot.inv .chip,#bot.inv .nb{border-color:rgba(244,241,234,.26)}
#top.inv .x,#top.inv .part,#bot.inv .part,#bot.inv #count{color:rgba(244,241,234,.62)}
#top.inv .part i{color:var(--coral)}
#bot.inv .part i{color:var(--coral)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:71;font-family:var(--fmono);
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);pointer-events:none;transition:opacity .4s}
.hint.inv{color:rgba(244,241,234,.5)}

/* ---------- botoes ---------- */
.btn{display:inline-flex;align-items:center;gap:11px;font-family:var(--fmono);font-weight:700;font-size:12px;
  letter-spacing:.15em;text-transform:uppercase;padding:14px 22px;border:2px solid var(--ink);
  transition:.2s var(--ease);white-space:nowrap}
.slide.dark .btn{border-color:var(--paper)}
.btn:hover{transform:translate(-2px,-2px)}
.btn.pri{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.btn.pri:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.slide.dark .btn.pri:hover{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn.gh:hover{background:var(--ink);color:var(--paper)}
.slide.dark .btn.gh:hover{background:var(--paper);color:var(--ink)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- componentes reutilizaveis ---------- */
.box{border:2px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:9px;transition:.24s var(--ease)}
.box.f{background:var(--fill)}
.box:hover{border-color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--fmono);font-weight:700;font-size:10px;
  letter-spacing:.15em;text-transform:uppercase;padding:5px 10px;border:2px solid var(--line);color:var(--soft)}
.tag.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 15px;
  font-size:12px;font-weight:600;background:var(--fill);border:2px solid var(--line)}
.dl{display:flex;flex-direction:column}
.dl>div{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.dl>div:last-child{border-bottom:0}
.dl dt{font-family:var(--fmono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--soft);min-width:130px}
.dl dd{font-size:14px;font-weight:500;flex:1}
.dl dd b{font-weight:700;color:var(--acc)}
.bar{height:8px;background:var(--fill);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transform-origin:left}
.ico{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:22px;height:22px;stroke-width:2.2}
.ico .pulse{animation:pls 2.4s ease-in-out infinite}
@keyframes pls{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
.ico .spin{animation:spn 9s linear infinite;transform-origin:center}
@keyframes spn{to{transform:rotate(360deg)}}
.ico .slide2{animation:sld 3.4s ease-in-out infinite}
@keyframes sld{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.ico .blink{animation:blk 3.6s ease-in-out infinite}
@keyframes blk{0%,92%,100%{opacity:1}95%{opacity:.1}}
.ico .wave{animation:wv 2.2s ease-out infinite}
.ico .wave.d2{animation-delay:.5s}.ico .wave.d3{animation-delay:1s}
@keyframes wv{0%{opacity:0;transform:scale(.5)}35%{opacity:1}100%{opacity:0;transform:scale(1.35)}}
.ico .rise{animation:rs 3s ease-in-out infinite}
@keyframes rs{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* imagem com lightbox */
.ph{position:relative;overflow:hidden;background:var(--fill);border:2px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.ph:hover img{transform:scale(1.05)}
.ph[data-lb]::after{content:'';position:absolute;inset:0;background:rgba(18,20,28,.06);opacity:0;transition:.3s}
.ph[data-lb]:hover::after{opacity:1}
.pk{filter:drop-shadow(0 18px 34px rgba(18,20,28,.3))}

/* lightbox */
#lb{position:fixed;inset:0;z-index:9990;background:rgba(10,11,16,.94);display:none;
  align-items:center;justify-content:center;padding:4vh 6vw}
#lb.on{display:flex;animation:fade .32s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#lb img{max-width:100%;max-height:88vh;width:auto;height:auto;object-fit:contain;
  animation:lbin .4s var(--ease) both}
@keyframes lbin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#lbcap{position:absolute;left:0;right:0;bottom:2.4vh;text-align:center;font-family:var(--fmono);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,234,.72)}
#lbx{position:absolute;top:2.4vh;right:3vw;width:44px;height:44px;border:2px solid rgba(244,241,234,.3);
  display:grid;place-items:center;color:var(--paper);transition:.2s}
#lbx:hover{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;
  border:2px solid rgba(244,241,234,.3);display:grid;place-items:center;color:var(--paper);transition:.2s}
.lbnav:hover{background:var(--coral);border-color:var(--coral);color:var(--ink)}
#lbp{left:2vw}#lbn{right:2vw}
#lb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* indice por capitulos */
#menu{position:fixed;inset:0;z-index:9950;background:var(--ink);color:var(--paper);display:none;
  padding:52px 58px;overflow:auto}
#menu.on{display:flex;flex-direction:column;gap:20px;animation:fade .3s var(--ease) both}
#menu .mh{display:flex;align-items:center;gap:18px}
#mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;flex:1;min-height:0}
#mgrid section{display:flex;flex-direction:column;gap:6px;min-width:0}
#mgrid h4{font-family:var(--fmono);font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--coral);padding-bottom:9px;border-bottom:2px solid rgba(244,241,234,.16);margin-bottom:5px}
#mgrid button{display:flex;gap:9px;padding:7px 8px;border-left:2px solid transparent;transition:.18s;font-size:12.5px;line-height:1.3}
#mgrid button:hover{border-left-color:var(--coral);background:rgba(244,241,234,.05)}
#mgrid button.cur{background:var(--coral);color:var(--ink);border-left-color:var(--coral)}
#mgrid b{font-family:var(--fmono);font-size:10px;color:var(--coral);flex-shrink:0;padding-top:1px}
#mgrid button.cur b{color:var(--ink)}

/* mobile: reorganiza em vez de so encolher */
#mob{display:none}
@media (max-width:820px),(max-height:430px){
  html,body{overflow:auto;background:var(--paper)}
  body{cursor:auto}
  #cur,#dot,.hint{display:none}
  #deck{position:static;overflow:visible}
  #stage{position:static;transform:none!important;width:100%;height:auto;background:var(--paper)}
  .slide{position:relative;inset:auto;display:flex!important;width:100%;height:auto;min-height:auto;
    padding:74px 20px 46px;animation:none!important;border-bottom:2px solid var(--line)}
  .slide.out{display:flex!important}
  .slide [data-a],.slide [data-fade],.slide [data-scale]{animation:none!important;opacity:1!important;transform:none!important}
  .slide .draw{stroke-dashoffset:0!important;animation:none!important}
  .slide .grow,.slide .growy,.slide .pop{animation:none!important;transform:none!important;opacity:1!important}
  .mid{gap:22px}
  h1{font-size:40px}h2{font-size:32px}h2.sm{font-size:27px}h3{font-size:22px}
  .lead{font-size:14.5px;max-width:none}.lead.big{font-size:16px}
  .note{font-size:9.5px}
  #top{position:absolute;top:0;height:64px;background:var(--paper);border-bottom:2px solid var(--line)}
  #bot,#prog,#top .part{display:none}
  #top .brand{gap:10px}
  #mob{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;height:54px;align-items:center;
    gap:10px;padding:0 16px;background:var(--ink);color:var(--paper)}
  #mob .mono{font-size:10px;color:rgba(244,241,234,.66)}
  #mob button{border:2px solid rgba(244,241,234,.3);padding:6px 12px;font-family:var(--fmono);
    font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  #menu{padding:24px 18px}
  #mgrid{grid-template-columns:1fr;gap:16px;overflow:auto}
  .bgw,.glw,.dotsw{display:none}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .stack-m{flex-direction:column!important}
  .hide-m{display:none!important}
  .grid-m1{grid-template-columns:1fr!important}
  .grid-m2{grid-template-columns:repeat(2,1fr)!important}
  .wide-m{min-width:640px}
}

@media print{
  html,body{overflow:visible;height:auto;background:#fff}
